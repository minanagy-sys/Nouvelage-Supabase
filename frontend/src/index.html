<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Nouvelage Clinics</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Nouvelage Aesthetic Clinics — luxury aesthetic, skin, and wellness treatments where beauty meets medical excellence.">

  <!-- Favicon (logo) -->
  <link rel="icon" type="image/png" href="favicon-logo.png">
  <link rel="apple-touch-icon" href="favicon-logo.png">

  <!-- Open Graph (default / home page) -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Nouvelage Clinics">
  <meta property="og:title" content="Nouvelage Clinics">
  <meta property="og:description" content="Luxury aesthetic, skin, and wellness treatments where beauty meets medical excellence.">
  <meta property="og:url" content="https://www.nouvelage.clinic/">
  <meta property="og:image" content="https://www.nouvelage.clinic/og-home.png">

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Nouvelage Clinics">
  <meta name="twitter:description" content="Luxury aesthetic, skin, and wellness treatments where beauty meets medical excellence.">
  <meta name="twitter:image" content="https://www.nouvelage.clinic/og-home.png">

  <!--
    Fonts are self-hosted (@font-face lives at the top of styles.css) instead
    of loaded from fonts.googleapis.com. That third-party stylesheet was
    render-blocking on every page: the browser painted nothing until Google
    answered.

    These six faces are the ones every page uses — Italiana for headings,
    Manrope 300/400/500 for body and UI text, and the two Cormorant Garamond
    italics for leads and the gold "em" accent. Preloading them is not
    speculative: without it they were discovered only once layout ran, landed
    ~400ms after first paint, and visibly reflowed the text as each swapped in
    (measured CLS 0.10 on /contact, 0.07 on /forher — both now ~0). They are
    fingerprint-free and cached for a year, so this cost is first visit only.
  -->
  <link rel="preload" href="/assets/fonts/Italiana-400-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/assets/fonts/Manrope-300-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/assets/fonts/Manrope-400-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/assets/fonts/Manrope-500-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/assets/fonts/CormorantGaramond-300i-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/assets/fonts/CormorantGaramond-400i-latin.woff2" as="font" type="font/woff2" crossorigin>

  <!--
    Leaflet is no longer loaded here. It used to be a blocking third-party
    script on all ten pages for the sake of the three that show a map; those
    pages now pull it from /assets/leaflet on demand (see leaflet-loader.ts).
  -->
</head>
<body>
  <app-root></app-root>

  <!--
    Google Tag Manager, started once the page has loaded so analytics never
    competes with rendering the site. requestIdleCallback yields to any
    remaining work; the 3s timeout is the fallback for Safari.
  -->
  <script>
  (function (w, d, s, l, i) {
    function start() {
      if (w.__gtmStarted) return;
      w.__gtmStarted = true;
      w[l] = w[l] || [];
      w[l].push({ 'gtm.start': new Date().getTime(), event: 'gtm.js' });
      var f = d.getElementsByTagName(s)[0];
      var j = d.createElement(s);
      j.async = true;
      j.src = 'https://www.googletagmanager.com/gtm.js?id=' + i + (l !== 'dataLayer' ? '&l=' + l : '');
      f.parentNode.insertBefore(j, f);
    }
    function schedule() {
      if (w.requestIdleCallback) w.requestIdleCallback(start, { timeout: 3000 });
      else setTimeout(start, 1500);
    }
    if (d.readyState === 'complete') schedule();
    else w.addEventListener('load', schedule, { once: true });
  })(window, document, 'script', 'dataLayer', 'GTM-N4NPGTWM');
  </script>
  <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-N4NPGTWM"
  height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
</body>
</html>
