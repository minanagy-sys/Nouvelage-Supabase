<div class="cart-overlay" *ngIf="cartOpen$ | async" (click)="closeCart()"></div>

<div class="cart-flyout" [class.open]="cartOpen$ | async">
  <div class="cart-header">
    <h3>Your Selection</h3>
    <button class="cart-close" (click)="closeCart()" aria-label="Close cart">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </button>
  </div>

  <div class="cart-items" *ngIf="(cartItems$ | async) as items">
    <div *ngIf="items.length === 0" class="cart-empty">
      <svg viewBox="0 0 24 24" class="empty-icon" fill="none" stroke="currentColor" stroke-width="1.5">
        <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
        <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
      </svg>
      <p>Your cart is empty</p>
      <a class="empty-cta" (click)="continueShopping()">Browse Services</a>
    </div>

    <div *ngFor="let item of items" class="cart-item">
      <div class="item-image">
        <img [src]="item.image || 'https://images.unsplash.com/photo-1560750588-73207b1ef5b8?w=200&h=200&fit=crop&q=80'" [alt]="item.name" loading="lazy">
      </div>
      <div class="item-details">
        <h4>{{ item.name }}</h4>
        <p class="item-type">{{ item.type === 'bundle' ? 'Bundle' : 'Service' }}</p>
        <div class="item-price">
          <span *ngIf="item.originalPrice" class="original-price">{{ item.originalPrice }} EGP</span>
          <span class="current-price">{{ item.price }} EGP</span>
        </div>
        <div class="item-quantity">
          <button (click)="updateQuantity(item.id, item.type, item.quantity - 1)" aria-label="Decrease quantity">−</button>
          <span>{{ item.quantity }}</span>
          <button (click)="updateQuantity(item.id, item.type, item.quantity + 1)" aria-label="Increase quantity">+</button>
        </div>
      </div>
      <button class="item-remove" (click)="removeItem(item.id, item.type)" aria-label="Remove item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>
  </div>

  <div class="cart-footer" *ngIf="(cartItems$ | async)?.length ?? 0 > 0">
    <div class="cart-total">
      <span>Subtotal</span>
      <span class="total-amount">{{ getTotal() }} EGP</span>
    </div>
    <button class="btn btn--solid" (click)="proceedToCheckout()">
      Proceed to Checkout <span>→</span>
    </button>
    <a class="continue-shopping" (click)="closeCart()">Continue Shopping</a>
  </div>
</div>
